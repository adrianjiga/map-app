<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="shortcut icon" type="image/png" href="/icon.png" />
    <link
      href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/src/main.js"></script>
    <title>Workout Map</title>
  </head>
  <body>
    <button
      class="mobile-menu-btn"
      aria-label="Open sidebar"
      aria-controls="sidebar"
      aria-expanded="false"
    >
      &#9776;
    </button>

    <div class="sidebar" id="sidebar">
      <div class="sidebar__header">
        <img src="logo.png" alt="Logo" class="logo" />
        <button class="sidebar__close-btn" aria-label="Close sidebar">
          &#10005;
        </button>
      </div>

      <div class="workout-summary" hidden>
        <p class="workout-summary__stat">
          <span class="workout-summary__value" data-summary="count">0</span>
          <span class="workout-summary__label">Workouts</span>
        </p>
        <p class="workout-summary__stat">
          <span class="workout-summary__value" data-summary="distance">0</span>
          <span class="workout-summary__label">Total km</span>
        </p>
        <p class="workout-summary__stat">
          <span class="workout-summary__value" data-summary="duration">0</span>
          <span class="workout-summary__label">Total time</span>
        </p>
      </div>

      <div class="sidebar__actions" hidden>
        <button class="sidebar__action" type="button" data-action="fit">
          Fit to markers
        </button>
        <button
          class="sidebar__action sidebar__action--danger"
          type="button"
          data-action="clear"
        >
          Clear all
        </button>
      </div>

      <ul class="workouts">
        <li class="form__item">
          <form class="form hidden" aria-label="Add workout">
            <div class="form__row">
              <label class="form__label" for="workout-type">Type</label>
              <select
                class="form__input form__input--type"
                id="workout-type"
                name="type"
              >
                <option value="running">Running</option>
                <option value="cycling">Cycling</option>
              </select>
            </div>
            <div class="form__row">
              <label class="form__label" for="workout-distance">Distance</label>
              <input
                class="form__input form__input--distance"
                id="workout-distance"
                name="distance"
                type="number"
                inputmode="decimal"
                step="any"
                placeholder="km"
              />
            </div>
            <div class="form__row">
              <label class="form__label" for="workout-duration">Duration</label>
              <input
                class="form__input form__input--duration"
                id="workout-duration"
                name="duration"
                type="number"
                inputmode="decimal"
                step="any"
                placeholder="min"
              />
            </div>
            <div class="form__row form__row--hidden">
              <label class="form__label" for="workout-elevation">
                Elevation Gain
              </label>
              <input
                class="form__input form__input--elevation"
                id="workout-elevation"
                name="elevation"
                type="number"
                inputmode="decimal"
                step="any"
                placeholder="meters"
              />
            </div>
            <div class="form__row">
              <label class="form__label" for="workout-cadence">Cadence</label>
              <input
                class="form__input form__input--cadence"
                id="workout-cadence"
                name="cadence"
                type="number"
                inputmode="decimal"
                step="any"
                placeholder="step/min"
              />
            </div>
            <div class="form__row form__row--actions">
              <button class="form__btn" type="submit">Add workout</button>
            </div>
          </form>
        </li>
        <li class="workouts__empty">
          Click anywhere on the map to log your first workout.
        </li>
      </ul>

      <p class="sidebar__copyright">
        &copy; Copyright by
        <a
          class="sidebar__link"
          target="_blank"
          href="https://github.com/adrianjiga"
          >Adrian Jiga
        </a>
      </p>
    </div>

    <div id="map"></div>
  </body>
</html>
